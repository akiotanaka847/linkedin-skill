name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]
        # setup-python ya no publica 3.9 para Ubuntu 26.04; 3.9 se prueba en macOS y Windows.
        exclude:
          - os: ubuntu-latest
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Solo biblioteca estándar: no hay nada que instalar.
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONUTF8: "1"
